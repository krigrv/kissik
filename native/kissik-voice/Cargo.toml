[package]
name = "kissik-voice"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Panic-safe C API over DeepFilterNet for KISSIK"

[lib]
name = "kissik_voice"
crate-type = ["cdylib"]

[dependencies]
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract"] }
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# fp16 kernels aren't needed for this model, and their build probe can't link on Windows ARM64.
[target.'cfg(target_arch = "aarch64")'.dependencies]
tract-linalg = { version = "0.19", features = ["no_fp16"] }

# Windows ARM64: tract-linalg 0.19 sends its ARM64 assembly to the x86-only Microsoft assembler. One-line fix in build.rs.
[patch.crates-io]
tract-linalg = { path = "vendor/tract-linalg" }
