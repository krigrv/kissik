name: Build and test

on:
  push:
    branches: [main, kissik-studio]
  pull_request:

# Builds and tests only; nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build the app
        run: dotnet build src/OpenKamera.App -c Release -p:Platform=x64
      - name: Run the tests
        # Cloud machines have no sound device or GPU: tests marked Hardware run on real PCs only.
        run: dotnet test tests/OpenKamera.Core.Tests -c Release --filter "Category!=Hardware"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the phone app
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kissik-camera-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
