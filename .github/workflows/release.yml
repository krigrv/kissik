name: Release

# Push a tag like v1.0.0 to publish a release. GitHub writes the notes from the merged pull requests
# (see .github/release.yml) and attaches the KISSIK Camera Android app, signed with the project's permanent key
# (repository secrets) so every version installs over the last one. The Windows app ships through the
# Microsoft Store (tools/make-store-package.ps1).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack the signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/kissik.jks"
      - name: Build the signed phone app
        working-directory: android
        env:
          KISSIK_KEYSTORE: ${{ runner.temp }}/kissik.jks
          KISSIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KISSIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Name it for the release
        run: cp android/app/build/outputs/apk/release/app-release.apk "KISSIK-Camera-${GITHUB_REF_NAME}.apk"
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: KISSIK - Camera Studio ${{ github.ref_name }}
          body: |
            ## Download
            - **Windows:** [KISSIK - Camera Studio on the Microsoft Store](https://apps.microsoft.com/detail/9MZC9QRSWK72). It updates itself.
            - **Your phone as a camera (Android):** download `KISSIK-Camera-${{ github.ref_name }}.apk` below and open it on your phone.

            More at [kissik-studio.vercel.app](https://kissik-studio.vercel.app).
          generate_release_notes: true
          files: KISSIK-Camera-*.apk
