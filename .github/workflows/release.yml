name: Release

# Push a tag like v1.0.0 to publish a release. GitHub writes the notes from the merged pull requests
# (see .github/release.yml) and attaches the KISSIK Camera Android app. Attach the signed Windows
# package yourself (tools/make-store-package.ps1): it needs your code-signing certificate.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the phone app
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name it for the release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "KISSIK-Camera-${GITHUB_REF_NAME}.apk"
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: KISSIK-Camera-*.apk
