# Generate the Xcode project on a Mac:  brew install xcodegen && cd mobile-studio/iosApp && xcodegen
name: iosApp
options:
  bundleIdPrefix: app.kissik
  deploymentTarget: { iOS: "16.0" }
packages:
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift
    from: 2.0.0
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    dependencies:
      - package: HaishinKit
    info: { path: iosApp/Info.plist }
    settings:
      base:
        PRODUCT_NAME: KISSIK
        PRODUCT_BUNDLE_IDENTIFIER: app.kissik.studio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "Shared"]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
