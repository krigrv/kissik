<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>OpenKamera</title>
  <defs>
    <radialGradient id="tile" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#232832"/>
      <stop offset="1" stop-color="#0C0E12"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A6"/>
      <stop offset="0.55" stop-color="#FFD36B"/>
      <stop offset="1" stop-color="#F2A93B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.62" stop-color="#FFD36B" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#FFD36B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFD36B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#2B3442"/>
      <stop offset="0.6" stop-color="#11151B"/>
      <stop offset="1" stop-color="#07080A"/>
    </radialGradient>
  </defs>
  <!-- Tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <!-- Ring light: soft glow + gold band -->
  <circle cx="512" cy="530" r="420" fill="url(#glow)"/>
  <circle cx="512" cy="530" r="318" fill="none" stroke="url(#ring)" stroke-width="92"/>
  <!-- Lens -->
  <circle cx="512" cy="530" r="178" fill="url(#lens)" stroke="#2C323C" stroke-width="12"/>
  <circle cx="512" cy="530" r="92" fill="#0A0C0F" stroke="#1E242D" stroke-width="8"/>
  <circle cx="512" cy="530" r="30" fill="#FFD36B"/>
  <ellipse cx="458" cy="470" rx="46" ry="28" fill="#FFFFFF" fill-opacity="0.32" transform="rotate(-35 458 470)"/>
  <!-- Spark -->
  <path d="M808 168 L828 232 L892 252 L828 272 L808 336 L788 272 L724 252 L788 232 Z" fill="#FFF3CF"/>
</svg>
